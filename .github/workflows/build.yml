name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          brew install ldid xz || true
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -sL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/sdks" | head -5

      - name: Build
        run: |
          set -e
          make package FINALPACKAGE=1

      - name: Collect deb
        run: |
          mkdir -p out
          cp packages/*.deb out/ 2>/dev/null || cp .theos/_/DEBIAN/../*.deb out/ 2>/dev/null || true
          ls -lh out/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: out/
          if-no-files-found: warn
