name: Build dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -isysroot "$SDK" \
                -arch arm64 \
                -miphoneos-version-min=15.0 \
                -dynamiclib -fobjc-arc -fblocks \
                -framework Foundation -framework UIKit \
                probe.m -o JoolinkProbe.dylib
          ls -lh JoolinkProbe.dylib
          file JoolinkProbe.dylib

      - name: Pseudo-sign
        run: |
          brew install ldid >/dev/null 2>&1 || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S JoolinkProbe.dylib && echo "ldid ok"
          else
            echo "ldid unavailable, skip signing"
          fi
          plutil -p JoolinkProbe.dylib >/dev/null 2>&1 || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: JoolinkProbe-dylib
          path: JoolinkProbe.dylib
          if-no-files-found: error
